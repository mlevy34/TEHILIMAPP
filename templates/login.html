<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Tehilim Together</title>

    <link rel="stylesheet" href="static/login.css">

</head>

<body>

    <div class="container">

        <header class="page-header">

            <h1>Tehilim Together</h1>

            <p class="subtitle">
                Log in to continue to your groups.
            </p>

        </header>

        <main class="login-card">

            <h2>Log In</h2>

            <form action="/" method="POST">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit" class="login-button">
                    Log In
                </button>

            </form>

            <p class="create-account">
                Don't have an account?
                <a href="create_account.html">Create an account</a>
            </p>

        </main>

    </div>

</body>

</html>
